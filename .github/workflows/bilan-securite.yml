name: Bilan de sécurité
# Bilan hebdomadaire (lot S3) : résumé de la surveillance dans un ticket, et détection d'un moniteur muet (tâche planifiée désactivée ou retardée).
on:
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite-node scripts/bilan.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
